name: Build Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - staging
    paths:
      - Dockerfile
      - docker-compose.yml
      - server/**
      - storage/README.md
      - .github/workflows/deploy.yml
  pull_request:
    branches:
      - main
      - develop
      - staging
    paths:
      - Dockerfile
      - docker-compose.yml
      - server/**
      - storage/README.md
      - .github/workflows/deploy.yml

concurrency:
  group: vibe-lsp-server-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: samuelloza
  IMAGE_BASE_NAME: vibe-lsp-server

jobs:
  docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_BASE_NAME }}-${{ github.head_ref || github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
